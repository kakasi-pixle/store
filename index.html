<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>الولبي المتخلخل</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#001126;color:#fff;font-family:system-ui,Arial;touch-action:none}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at center,#071b31 0,#001126 68%)}
#hud{position:absolute;top:8px;left:8px;right:8px;z-index:5;display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px}
.panel{background:#06182ddc;border:1px solid #537084;border-radius:7px;padding:4px 6px;box-shadow:0 0 8px #001}
#bossbar{position:absolute;top:39px;left:27%;width:46%;height:7px;border:1px solid #d7e5f1;background:#06101c;z-index:4}
#bossfill{height:100%;width:100%;background:#e53c69;transition:width .15s}
#arena{position:absolute;inset:0;overflow:hidden}
.enemy{position:absolute;width:54px;height:54px;object-fit:cover;border:1px solid #7a9fb6;box-shadow:0 0 12px #6daaff66;border-radius:3px;user-select:none}
.enemy.boss{width:76px;height:76px;border:2px solid #ff6a85;box-shadow:0 0 18px #ff315d88}
.minion{width:32px;height:32px;border-color:#a5bad0}
#plane{position:absolute;z-index:3;width:30px;height:28px;left:50%;top:76%;transform:translate(-50%,-50%);font-size:0;filter:drop-shadow(0 0 5px #18dfff)} #plane:before{content:'';position:absolute;left:4px;top:0;width:22px;height:23px;border:2px solid #45eaff;border-bottom:0;border-radius:15px 15px 0 0;background:#0a8ca8} #plane:after{content:'';position:absolute;left:4px;top:10px;width:22px;height:12px;border:2px solid #45eaff;border-top:0;border-radius:0 0 4px 4px;background:#0a8ca8}
.shot{position:absolute;width:4px;height:16px;border-radius:5px;background:#24e7ff;box-shadow:0 0 9px #24e7ff;z-index:2}
.bullet{position:absolute;width:7px;height:13px;border-radius:4px;background:#ffb21e;box-shadow:0 0 8px #ff7a00;z-index:2}
#stick{position:absolute;left:22px;bottom:28px;width:116px;height:116px;border-radius:50%;background:#34495bbd;border:1px solid #6e8598;z-index:8;touch-action:none}
#knob{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:#f5fbff;border:3px solid #9fb5c8;box-shadow:0 2px 12px #0008}
#hint{position:absolute;bottom:12px;right:10px;max-width:54%;font-size:11px;color:#a9c2d5;text-align:right}
#bossintro{position:absolute;top:54px;left:50%;transform:translateX(-50%);z-index:9;background:#071b30eF;border:1px solid #ff6a85;border-radius:10px;padding:9px 14px;max-width:90%;text-align:center;font-weight:800;font-size:15px;white-space:nowrap;box-shadow:0 0 18px #ff315d55;opacity:0;pointer-events:none;transition:opacity .25s}
#bossintro.show{opacity:1}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#001126dd;z-index:20;text-align:center;padding:25px}
#dialog{max-width:330px;background:#071b30;border:1px solid #51728c;border-radius:16px;padding:22px;box-shadow:0 0 35px #00bde955}
#dialog h1{font-size:24px;margin:0 0 8px}#dialog p{line-height:1.7;color:#c4d7e5}
button{border:0;border-radius:10px;background:#00c8e8;color:#001126;font-weight:800;font-size:16px;padding:12px 24px}
#sound{position:absolute;right:12px;top:76px;z-index:7;border-radius:50%;width:44px;height:44px;padding:0;background:#253d51cc;color:white;border:1px solid #7890a3}
@media(min-width:700px){#game{max-width:430px;margin:auto;border-left:1px solid #345}body{background:#000}}
</style>
</head>
<body>
<div id="game">
 <div id="hud">
  <div class="panel">المرحلة <b id="level">1</b>/5</div>
  <div class="panel">HP: <b id="hp">100</b></div>
  <div class="panel" id="enemyname">الولبي المتخلخل</div>
 </div>
 <div id="bossbar"><div id="bossfill"></div></div>
 <button id="sound" aria-label="الصوت">♫</button>
 <div id="bossintro"></div>
 <div id="arena">
  <div id="plane"></div>
 </div>
 <div id="stick"><div id="knob"></div></div>
 <div id="hint">حرّك عصا التحكم لتفادي الطلقات — إطلاق النار تلقائي</div>
 <div id="overlay"><div id="dialog"><h1>الطائرة ضد الوحوش</h1><p>قاتل الوحوش الخمسة، تفادَ الطلقات وحرّك الطائرة بعصا التحكم. إطلاق النار تلقائي.</p><button id="start">ابدأ اللعب</button></div></div>
</div>
<script>
(()=>{
const arena=document.getElementById('arena'),plane=document.getElementById('plane'),stick=document.getElementById('stick'),knob=document.getElementById('knob');
const hpEl=document.getElementById('hp'),levelEl=document.getElementById('level'),nameEl=document.getElementById('enemyname'),bar=document.getElementById('bossfill'),overlay=document.getElementById('overlay'),intro=document.getElementById('bossintro');
const bosses=[
 {name:'الولبي المتخلخل',img:'https://i.ibb.co/kg8KTv5J/IMG20260928122647.jpg',hp:18,minions:3,rate:1000,pattern:'single'},
 {name:'القزم الأسود',img:'https://i.ibb.co/MkSFHKRn/IMG20260927105029.jpg',hp:26,minions:5,rate:850,pattern:'spread'},
 {name:'الملتهم الأحمق',img:'https://i.ibb.co/8nrqvqby/IMG20261004083141.jpg',hp:34,minions:7,rate:700,pattern:'aimed'},
 {name:'الأبيض الشرس',img:'https://i.ibb.co/tpVdhmXd/IMG20260927105042.jpg',hp:44,minions:9,rate:590,pattern:'burst'},
 {name:'المجهول المقرف الأبيض الكريه',img:'https://i.ibb.co/tPXL0GkJ/IMG20260927105217.jpg',hp:68,minions:12,rate:380,pattern:'final'}
];
let W,H,px=.5,py=.76,dx=0,dy=0,playing=false,hp=100,stage=0,boss=null,enemies=[],shots=[],bullets=[],lastShot=0,lastEnemyShot=0,lastTime=0,raf=0,soundOn=true;
function size(){W=arena.clientWidth;H=arena.clientHeight;px=Math.min(1,Math.max(0,px));py=Math.min(1,Math.max(0,py))}
window.addEventListener('resize',size);size();
function el(tag,cls){let n=document.createElement(tag);if(cls)n.className=cls;arena.appendChild(n);return n}
function spawnEnemy(isBoss=false){
 const spec=bosses[stage],node=el('img','enemy'+(isBoss?' boss':' minion'));node.src=spec.img;node.alt=spec.name;
 const e={node,x:isBoss?W*.5:Math.random()*(W-40)+20,y:isBoss?H*.17:Math.random()*H*.35+H*.08,isBoss,hp:isBoss?spec.hp:2,max:isBoss?spec.hp:2,phase:Math.random()*7};
 enemies.push(e);return e
}
function announceBoss(name){
 intro.textContent='⚠ البوص: '+name+' ⚠';intro.classList.add('show');
 if(soundOn&&'speechSynthesis' in window){
  try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('البوص الجديد: '+name);u.lang='ar-EG';u.rate=.88;u.pitch=.82;u.volume=1;speechSynthesis.speak(u)}catch(e){}
 }
 setTimeout(()=>intro.classList.remove('show'),2300);
}
function startStage(){enemies.forEach(e=>e.node.remove());enemies=[];shots.forEach(x=>x.node.remove());shots=[];bullets.forEach(x=>x.node.remove());bullets=[];boss=spawnEnemy(true);for(let i=0;i<bosses[stage].minions;i++)spawnEnemy(false);nameEl.textContent=bosses[stage].name;levelEl.textContent=stage+1;bar.style.width='100%';lastEnemyShot=performance.now()+450;announceBoss(bosses[stage].name);}
function shootPlayer(t){if(t-lastShot<190)return;lastShot=t;const s=el('div','shot');s.style.left=(px*W-2)+'px';s.style.top=(py*H-28)+'px';shots.push({node:s,x:px*W,y:py*H-28})}
function shootEnemy(e,angleOffset=0,speed=2.5){
 const b=el('div','bullet');b.style.left=e.x+'px';b.style.top=(e.y+24)+'px';
 let tx=px*W,ty=py*H,dx=tx-e.x,dy=ty-e.y,a=Math.atan2(dy,dx)+angleOffset;
 bullets.push({node:b,x:e.x,y:e.y+24,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed})
}
function bossAttack(t){
 const spec=bosses[stage],living=enemies.filter(e=>!e.isBoss);
 living.forEach((e,i)=>{if(t-(e.lastShot||0)>spec.rate*(stage<2?2.0:1.45)+i*75){shootEnemy(e,0,1.8+stage*.18);e.lastShot=t}});
 if(t-lastEnemyShot<spec.rate)return;
 lastEnemyShot=t;
 if(stage===0){shootEnemy(boss,0,2.1)}
 else if(stage===1){[-.24,0,.24].forEach(a=>shootEnemy(boss,a,2.3))}
 else if(stage===2){shootEnemy(boss,0,2.7);shootEnemy(boss,-.18,2.3);shootEnemy(boss,.18,2.3)}
 else if(stage===3){for(let i=-2;i<=2;i++)shootEnemy(boss,i*.17,2.7);living.forEach((e,i)=>{if(i%2===0)shootEnemy(e,0,2.2)})}
 else {
   const mode=Math.floor(t/1700)%4;
   if(mode===0){for(let i=-3;i<=3;i++)shootEnemy(boss,i*.14,3.0)}
   else if(mode===1){for(let i=0;i<12;i++)shootEnemy(boss,i*Math.PI/6,2.5)}
   else if(mode===2){for(let i=-2;i<=2;i++)shootEnemy(boss,i*.10,3.3);living.forEach(e=>shootEnemy(e,0,2.8))}
   else {for(let i=0;i<8;i++)shootEnemy(boss,i*Math.PI/4+ t*.001,2.8)}
 }
}
function end(msg,title){playing=false;overlay.style.display='flex';document.getElementById('dialog').innerHTML='<h1>'+title+'</h1><p>'+msg+'</p><button id="again">العب مرة أخرى</button>';document.getElementById('again').onclick=reset}
function reset(){hp=100;stage=0;px=.5;py=.76;hpEl.textContent=hp;overlay.style.display='none';playing=true;startStage();lastTime=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function loop(t){
 if(!playing)return;let dt=Math.min(32,t-(lastTime||t));lastTime=t;
 px=Math.max(.06,Math.min(.94,px+dx*dt*.00048));py=Math.max(.12,Math.min(.91,py+dy*dt*.00048));
 plane.style.left=(px*W)+'px';plane.style.top=(py*H)+'px';shootPlayer(t);
 enemies.forEach(e=>{
  if(e.isBoss){e.x=W*.5+Math.sin(t*(stage===4?.0018:.001))*W*(stage===4?.34:.27);e.y=H*.15+Math.sin(t*(stage===4?.003:.0017))* (stage===4?24:12)}
  else {e.x+=Math.sin(t*.0015+e.phase)*.7;e.y+=Math.sin(t*.001+e.phase)*.25}
  e.node.style.left=(e.x-(e.isBoss?38:16))+'px';e.node.style.top=(e.y-(e.isBoss?38:16))+'px';
 });
 bossAttack(t)
 shots.forEach(s=>{s.y-=7;s.node.style.top=s.y+'px';for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(Math.abs(s.x-e.x)<(e.isBoss?39:20)&&Math.abs(s.y-e.y)<(e.isBoss?40:23)){e.hp--;s.y=-100;if(e.hp<=0){e.node.remove();enemies.splice(i,1);if(e.isBoss){stage++;if(stage>=bosses.length){end('لقد هزمت جميع الوحوش وأنقذت الطائرة!','انتصار!');return}else{startStage();return}}}break}}});
 shots=shots.filter(s=>{if(s.y<-25){s.node.remove();return false}return true});
 bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.node.style.left=b.x+'px';b.node.style.top=b.y+'px';if(Math.hypot(b.x-px*W,b.y-py*H)<23){hp-=1;b.y=H+99;hpEl.textContent=hp}});
 bullets=bullets.filter(b=>{if(b.y>H+20||b.x<0||b.x>W){b.node.remove();return false}return true});
 bar.style.width=(boss?Math.max(0,boss.hp/boss.max*100):100)+'%';
 if(hp<=0){end('لقد هُزمت الطائرة. جرّب مرة أخرى وتفادَ الطلقات.','انتهت اللعبة');return}
 raf=requestAnimationFrame(loop)
}
let active=false,originX=0,originY=0;
function pointerDown(e){active=true;stick.setPointerCapture?.(e.pointerId);let r=stick.getBoundingClientRect();originX=r.left+r.width/2;originY=r.top+r.height/2;moveStick(e)}
function moveStick(e){if(!active)return;let x=e.clientX-originX,y=e.clientY-originY,len=Math.hypot(x,y),max=34;if(len>max){x=x/len*max;y=y/len*max}knob.style.left=(33+x)+'px';knob.style.top=(33+y)+'px';dx=x/max;dy=y/max}
function pointerUp(){active=false;dx=dy=0;knob.style.left='33px';knob.style.top='33px'}
stick.addEventListener('pointerdown',pointerDown);stick.addEventListener('pointermove',moveStick);stick.addEventListener('pointerup',pointerUp);stick.addEventListener('pointercancel',pointerUp);
document.getElementById('start').onclick=reset;
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'♫':'♪';if(!soundOn&&'speechSynthesis' in window)speechSynthesis.cancel()};
})();
</script>
</div>
</body>
</html>
